name: Pianke
options:
  bundleIdPrefix: com.ganhoo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Pianke:
    type: application
    platform: iOS
    sources:
      - JournalApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganhoo.pianke
        PRODUCT_NAME: Pianke
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: JournalApp/Info.plist
      properties:
        CFBundleDisplayName: 片刻
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: 拍照并添加到日记
        NSPhotoLibraryUsageDescription: 从相册选择照片添加到日记
        NSMicrophoneUsageDescription: 录制语音添加到日记
        NSLocationWhenInUseUsageDescription: 在日记中记录你所在的地点
        NSFaceIDUsageDescription: 使用面容 ID 解锁你的日记
