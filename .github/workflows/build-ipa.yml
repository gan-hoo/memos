name: Build IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Memos.xcodeproj \
            -scheme Memos \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | xcpretty || (tail -n 200 build.log; exit 1)

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Memos.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Memos-unsigned.ipa Payload
          ls -lh Memos-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Memos-unsigned-ipa
          path: Memos-unsigned.ipa

      - name: Publish release (latest)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
          files: Memos-unsigned.ipa
