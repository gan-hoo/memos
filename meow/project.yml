name: Meow
options:
  bundleIdPrefix: com.ganhoo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Meow:
    type: application
    platform: iOS
    sources:
      - MeowApp
      # Built web frontend of XuYouo/Meow (see .github/workflows/build-meow-ipa.yml),
      # copied into the app bundle as a folder and served via the meow:// scheme.
      - path: web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganhoo.meow
        PRODUCT_NAME: Meow
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: MeowApp/Info.plist
      properties:
        CFBundleDisplayName: Meow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: 用于拍照并添加到笔记
        NSPhotoLibraryUsageDescription: 用于选择图片添加到笔记
        NSPhotoLibraryAddUsageDescription: 用于保存分享图片到相册
        NSMicrophoneUsageDescription: 用于录制笔记中的语音片段
